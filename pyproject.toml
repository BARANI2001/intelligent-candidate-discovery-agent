[project]
name = "intelligent-candidate-discovery-agent"
version = "0.1.0"
description = "FastAPI backend for candidate discovery and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "python-docx",
    "python-multipart",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
